apiVersion: cache.yourorg.io/v1
kind: RedisCluster
metadata:
  labels:
    app.kubernetes.io/name: redis-cluster-operator
    app.kubernetes.io/managed-by: kustomize
  name: rediscluster-sample
spec:
  nodes: 3
  replicasPerNode: 1
  image: redis:7.2-alpine
  storageSize: 1Gi
  # Optional but recommended: enables requirepass/masterauth + protected-mode.
  passwordSecretRef:
    name: rediscluster-sample-auth
    key: password
